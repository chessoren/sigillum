<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="description" content="Sigillum: a sovereignty seal for AI tools, from A to E, with proof behind every answer."><link rel="icon" href="img/favicon.svg" type="image/svg+xml"><link rel="preload" href="fonts/SourceSerif4-opsz.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="fonts/Inter-wght.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="styles.css"><script src="app.js" defer></script><title>Sigillum</title></head>
<body data-page="home">
<a class="skip" href="#main">Skip to content</a>
<div id="banner"></div>
<div class="shell">
  <div id="header"></div>
  <section class="hero" aria-labelledby="hero-title">
    <h1 class="type-heading-xl" id="hero-title"></h1>
    <p class="type-lead" id="hero-lead"></p>
    <div class="ask">
      <div class="ask-media">
        <form class="ask-form" id="ask" role="search">
          <label for="ask-input" class="sr-only">Project</label>
          <input id="ask-input" autocomplete="off" spellcheck="false">
          <span class="tool" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="6" cy="6" r="2.4"/><circle cx="6" cy="18" r="2.4"/><circle cx="18" cy="8" r="2.4"/><path d="M6 8.4v7.2"/><path d="M18 10.4c0 4-6 3.2-11 6"/></svg></span>
          <span class="tool" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg></span>
          <button class="send" id="ask-send" type="submit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></button>
        </form>
        <div class="stage" id="stage"><div id="stage-card"></div></div>
      </div>
      <div class="carousel-controls">
        <button class="icon-btn" id="c-prev" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 6-6 6 6 6"/></svg></button>
        <button class="icon-btn" id="c-play" aria-label="Pause"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6v12M15 6v12"/></svg></button>
        <button class="icon-btn" id="c-next" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg></button>
      </div>
      <div class="examples" id="examples"></div>
      <div id="ask-out"></div>
    </div>
  </section>
</div>
<main id="main">
  <section class="section manifesto" id="how">
    <p id="manifesto"></p>
    <form class="mini-ask" id="mini"><label for="mini-input" class="sr-only">Git URL</label><input id="mini-input" autocomplete="off"><button class="send" type="submit" aria-label="Examine"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></button></form>
  </section>
  <section class="container features" id="features"></section>
  <section class="container big-center">
    <h2 class="type-heading-l" id="q-title"></h2>
    <p class="type-lead" id="q-lead"></p>
    <div class="q-grid" id="q-grid"></div>
  </section>
  <section class="container" style="padding-top:calc(var(--section) * 1.2)">
    <div class="feature" style="grid-template-columns:minmax(0,560px) minmax(0,400px);gap:96px">
      <div style="display:grid;gap:16px"><div id="ap-gap"></div><div id="ap-lines" style="display:grid;grid-template-columns:1fr 1fr;gap:12px"></div></div>
      <div class="feature-copy"><span class="badge apertus">Apertus v1.5</span><h2 class="type-feature" id="ap-title"></h2><p class="type-body-l" id="ap-body"></p><div id="ap-link"></div></div>
    </div>
  </section>
  <section class="container big-center">
    <h2 class="type-heading-l" id="self-title"></h2>
    <p class="type-lead" id="self-lead"></p>
    <a class="btn btn-soft" id="self-btn" style="height:56px;padding:0 28px;font-size:1.0625rem"></a>
    <div class="collage" id="collage"></div>
  </section>
</main>
<div id="menu"></div>
<div id="footer"></div>
</body></html>
